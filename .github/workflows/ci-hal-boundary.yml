---
# HAL boundary: ESP-IDF, FreeRTOS and Esp* code only under lib/managers/bsp_bind/<family>/ (ADR 0004); no heap or
# heap-backed type in the HAL library (ADR 0005); and the MCU-free part of the HAL (facade, managers, board
# binding) builds on a host against bsp_bind/host and passes the manager tests in tests/host (GCC, Clang, UBSan).
name: "\U0001F9F1 HAL Boundary CI"

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hal-boundary-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boundary-lint:
    name: Boundary and allocation lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the shrink-only allowlist check reads the base branch's list

      - name: lint_hal_boundary.sh
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash tools/lint/lint_hal_boundary.sh --base "origin/${{ github.base_ref }}"
          else
            bash tools/lint/lint_hal_boundary.sh
          fi

      - name: lint_hal_alloc.sh
        run: bash tools/lint/lint_hal_alloc.sh

  host-tests:
    name: Host build and tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            cxx: g++
            sanitizers: ""
          - name: clang
            cc: clang
            cxx: clang++
            sanitizers: ""
          - name: clang-ubsan
            cc: clang
            cxx: clang++
            sanitizers: undefined
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Configure
        run: >-
          cmake -S tests/host -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DHF_HAL_SANITIZERS="${{ matrix.sanitizers }}"

      - name: Build
        run: cmake --build build/host

      - name: Test
        run: ctest --test-dir build/host --output-on-failure
