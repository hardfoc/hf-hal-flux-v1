<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 740" width="980" height="740" role="img" aria-labelledby="t-flux d-flux">
  <title id="t-flux">HardFOC Flux V1 &#8212; HAL architecture and board topology</title>
  <desc id="d-flux">HardFOC Flux V1 valve-control board. The HAL stacks application code on top of board-specific managers (ValveManager, AdcManager, etc.) which orchestrate per-chip handlers (TLE92466ED, MAX22200, ADS7952, WS2812, NTC) backed by the shared hf-core platform. Bottom: the physical chip layout with bus interconnects.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .panel    { fill: #ffffff; }
      .app      { fill: #f0fff4; stroke: #276749; stroke-width: 2; }
      .api      { fill: #fef5e7; stroke: #c05621; stroke-width: 2; }
      .mgr      { fill: #ebf4ff; stroke: #2c5282; stroke-width: 2; }
      .mgr-cell { fill: #ffffff; stroke: #4299e1; stroke-width: 1.5; }
      .core     { fill: #fff5f5; stroke: #c53030; stroke-width: 2; }
      .core-cell{ fill: #ffffff; stroke: #e53e3e; stroke-width: 1.5; }
      .board    { fill: #f4f6f8; stroke: #1a365d; stroke-width: 2; }
      .mcu      { fill: #fef5e7; stroke: #c05621; stroke-width: 2; }
      .chip     { fill: #ebf4ff; stroke: #2c5282; stroke-width: 1.6; }
      .adc-chip { fill: #f0fff4; stroke: #276749; stroke-width: 1.6; }
      .sense    { fill: #f0fff4; stroke: #276749; stroke-width: 1.6; }
      .led      { fill: #faf5ff; stroke: #6b46c1; stroke-width: 2; }
      .wire-spi2{ stroke: #2b6cb0; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-spi3{ stroke: #276749; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-dasharray: 6 3; }
      .wire-can { stroke: #d69e2e; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-rmt { stroke: #6b46c1; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-adc { stroke: #4a5568; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 3 2; }
      .arrow-dn { stroke: #2c5282; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .head     { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .layer-title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; text-anchor: start; }
      .title    { font-family: system-ui, sans-serif; font-size: 12.5px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .titleL   { font-family: system-ui, sans-serif; font-size: 12.5px; font-weight: 600; fill: #1a365d; text-anchor: start; }
      .small    { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: middle; }
      .smallL   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: start; }
      .smallR   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: end; }
      .pin      { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 11px; fill: #1a202c; text-anchor: middle; }
      .pinL     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 11px; fill: #1a202c; text-anchor: start; }
      .legend   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; }
      .badge    { font-family: system-ui, sans-serif; font-size: 10.5px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    ]]></style>
    <marker id="ar-d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2c5282"/>
    </marker>
  </defs>
  <rect class="panel" width="980" height="740"/>

  <text class="head" x="490" y="24">HardFOC Flux V1 &#8212; HAL architecture and board topology</text>
  <text class="small" x="490" y="42">Valve-control board. Drives 8 solenoid valves (MAX22200) and 6 proportional valves (TLE92466ED) with 12-ch external ADC (ADS7952).</text>

  <!-- =========== TOP HALF: software stack =========== -->

  <!-- Layer 1: Application -->
  <rect class="app" x="40" y="58" width="900" height="42" rx="6"/>
  <text class="titleL" x="56" y="76" fill="#276749">Application code  &#8212;  user firmware</text>
  <text class="smallL" x="56" y="92">#include "Flux.h"  &#8594;  Flux::GetInstance().valves().OpenAll();</text>

  <line class="arrow-dn" x1="200" y1="100" x2="200" y2="120" marker-end="url(#ar-d)"/>
  <line class="arrow-dn" x1="700" y1="100" x2="700" y2="120" marker-end="url(#ar-d)"/>

  <!-- Layer 2: Flux API -->
  <rect class="api" x="40" y="122" width="900" height="42" rx="6"/>
  <text class="titleL" x="56" y="140" fill="#c05621">Flux API  (lib/api)</text>
  <text class="smallL" x="56" y="156">Flux.h / Flux.cpp / FluxVersion.h &#8212; singleton facade exposing the board to user code.</text>

  <line class="arrow-dn" x1="200" y1="164" x2="200" y2="184" marker-end="url(#ar-d)"/>
  <line class="arrow-dn" x1="700" y1="164" x2="700" y2="184" marker-end="url(#ar-d)"/>

  <!-- Layer 3: Managers -->
  <rect class="mgr" x="40" y="186" width="900" height="74" rx="6"/>
  <text class="titleL" x="56" y="206" fill="#2c5282">Managers  (lib/managers)</text>
  <text class="smallL" x="56" y="222">Flux-specific orchestration. Each manager owns the handlers it needs.</text>

  <g>
    <rect class="mgr-cell" x="56"  y="230" width="110" height="24" rx="4"/><text class="title" x="111" y="246">CommChannels</text>
    <rect class="mgr-cell" x="172" y="230" width="110" height="24" rx="4"/><text class="title" x="227" y="246">GpioManager</text>
    <rect class="mgr-cell" x="288" y="230" width="110" height="24" rx="4"/><text class="title" x="343" y="246">AdcManager</text>
    <rect class="mgr-cell" x="404" y="230" width="110" height="24" rx="4"/><text class="title" x="459" y="246">TempManager</text>
    <rect class="mgr-cell" x="520" y="230" width="110" height="24" rx="4"/><text class="title" x="575" y="246">LedManager</text>
    <rect class="mgr-cell" x="636" y="230" width="300" height="24" rx="4"/><text class="title" x="786" y="246">ValveManager  (Flux-specific)</text>
  </g>

  <line class="arrow-dn" x1="200" y1="260" x2="200" y2="280" marker-end="url(#ar-d)"/>
  <line class="arrow-dn" x1="500" y1="260" x2="500" y2="280" marker-end="url(#ar-d)"/>
  <line class="arrow-dn" x1="800" y1="260" x2="800" y2="280" marker-end="url(#ar-d)"/>

  <!-- Layer 4: Handlers (hf-core) consumed -->
  <rect class="core" x="40" y="282" width="900" height="74" rx="6"/>
  <text class="titleL" x="56" y="302" fill="#c53030">Handlers consumed from hf-core  (lib/core/handlers)</text>
  <text class="smallL" x="56" y="318">Per-chip facade: lazy init, RtosMutex, CRTP adapter bridge, error mapping. Same handlers run on Vortex too.</text>

  <g>
    <rect class="core-cell" x="56"  y="326" width="140" height="24" rx="4"/><text class="title" x="126" y="342">Tle92466edHandler</text>
    <rect class="core-cell" x="202" y="326" width="140" height="24" rx="4"/><text class="title" x="272" y="342">Max22200Handler</text>
    <rect class="core-cell" x="348" y="326" width="126" height="24" rx="4"/><text class="title" x="411" y="342">Ads7952Handler</text>
    <rect class="core-cell" x="480" y="326" width="112" height="24" rx="4"/><text class="title" x="536" y="342">Ws2812Handler</text>
    <rect class="core-cell" x="598" y="326" width="100" height="24" rx="4"/><text class="title" x="648" y="342">NtcHandler</text>
    <rect class="core-cell" x="704" y="326" width="228" height="24" rx="4"/><text class="title" x="818" y="342">+ Logger, Comm, Gpio adapters</text>
  </g>

  <!-- =========== BOTTOM HALF: physical board (comm topology) =========== -->

  <line class="arrow-dn" x1="490" y1="356" x2="490" y2="380" marker-end="url(#ar-d)"/>
  <text class="smallL" x="498" y="374">platform layer constructs Esp* peripherals + chip drivers</text>

  <!-- Board panel -->
  <rect class="board" x="40" y="382" width="900" height="276" rx="6"/>
  <text class="layer-title" x="56" y="404" fill="#1a365d">Flux V1 board  (communication topology)</text>
  <text class="smallL" x="56" y="420">Flux MCU at the centre. SPI2 shared bus to valve drivers; SPI3 dedicated bus to ADS7952 ADC; RMT to status LED; CAN to host.</text>

  <!-- TLE92466ED on the left -->
  <rect class="chip" x="56" y="446" width="180" height="76" rx="6"/>
  <text class="title" x="146" y="470">TLE92466ED</text>
  <text class="small" x="146" y="488">6-ch low-side driver</text>
  <text class="small" x="146" y="504">proportional valves</text>

  <!-- Flux MCU at the centre -->
  <rect class="mcu" x="340" y="436" width="280" height="96" rx="6"/>
  <text class="title" x="480" y="460">Flux MCU</text>
  <text class="small" x="480" y="478">SPI2 host (valve drivers)</text>
  <text class="small" x="480" y="494">SPI3 host (ADS7952 ADC)</text>
  <text class="small" x="480" y="510">CAN/TWAI &#183; RMT &#183; internal ADC</text>

  <!-- MAX22200 on the right -->
  <rect class="chip" x="730" y="446" width="180" height="76" rx="6"/>
  <text class="title" x="820" y="470">MAX22200</text>
  <text class="small" x="820" y="488">8-ch half-bridge driver</text>
  <text class="small" x="820" y="504">on/off solenoid valves</text>

  <!-- WS2812 LED (prominent, to the right of MCU) -->
  <rect class="led" x="730" y="540" width="180" height="46" rx="6"/>
  <text class="title" x="820" y="560" fill="#6b46c1">WS2812 Status LED</text>
  <text class="small" x="820" y="576">RMT single-wire NRZ data</text>

  <!-- ADS7952 below MCU -->
  <rect class="adc-chip" x="340" y="556" width="180" height="56" rx="6"/>
  <text class="title" x="430" y="578">ADS7952</text>
  <text class="small" x="430" y="594">12-ch 12-bit SAR ADC</text>

  <!-- NTC + internal ADC sense -->
  <rect class="sense" x="56" y="556" width="170" height="56" rx="4"/>
  <text class="title" x="141" y="576">NTC thermistor</text>
  <text class="small" x="141" y="594">+ VBUS sense (internal ADC)</text>

  <!-- CAN transceiver -->
  <rect class="chip" x="560" y="556" width="150" height="56" rx="4"/>
  <text class="title" x="635" y="576">CAN/TWAI</text>
  <text class="small" x="635" y="594">transceiver to host</text>

  <!-- =========== Wires (comm only, no power) =========== -->

  <!-- SPI2: MCU to TLE92466ED (left) -->
  <line class="wire-spi2" x1="340" y1="474" x2="236" y2="474"/>
  <text class="smallL" x="244" y="466" fill="#2b6cb0">SPI2 (CS_TLE92466)</text>

  <!-- SPI2: MCU to MAX22200 (right) -->
  <line class="wire-spi2" x1="620" y1="474" x2="730" y2="474"/>
  <text class="smallR" x="724" y="466" fill="#2b6cb0">SPI2 (CS_MAX22200)</text>

  <!-- SPI3: MCU to ADS7952 (down) -->
  <line class="wire-spi3" x1="430" y1="532" x2="430" y2="556"/>
  <text class="smallL" x="438" y="550" fill="#276749">SPI3 (dedicated)</text>

  <!-- RMT: MCU to WS2812 -->
  <line class="wire-rmt" x1="620" y1="510" x2="730" y2="556"/>
  <text class="smallL" x="646" y="528" fill="#6b46c1">RMT</text>

  <!-- Internal ADC: MCU to NTC/VBUS -->
  <line class="wire-adc" x1="340" y1="510" x2="226" y2="570"/>
  <text class="smallR" x="286" y="534" fill="#4a5568">internal ADC</text>

  <!-- CAN: MCU to transceiver -->
  <line class="wire-can" x1="560" y1="510" x2="560" y2="556"/>
  <text class="smallL" x="568" y="540" fill="#d69e2e">CAN TX/RX</text>

  <!-- =========== Bottom legend =========== -->
  <g transform="translate(40, 686)">
    <text class="layer-title" x="0" y="0" fill="#1a365d">Legend</text>
    <line class="wire-spi2" x1="70"  y1="-5" x2="94" y2="-5"/>
    <text class="legend" x="100" y="-1">SPI2 (valve drivers, shared)</text>
    <line class="wire-spi3" x1="280" y1="-5" x2="304" y2="-5"/>
    <text class="legend" x="310" y="-1">SPI3 (ADC, dedicated)</text>
    <line class="wire-can" x1="460" y1="-5" x2="484" y2="-5"/>
    <text class="legend" x="490" y="-1">CAN / TWAI</text>
    <line class="wire-rmt" x1="570" y1="-5" x2="594" y2="-5"/>
    <text class="legend" x="600" y="-1">RMT (LED)</text>
    <line class="wire-adc" x1="660" y1="-5" x2="684" y2="-5"/>
    <text class="legend" x="690" y="-1">internal ADC</text>
    <line class="arrow-dn" x1="790" y1="-5" x2="814" y2="-5" marker-end="url(#ar-d)"/>
    <text class="legend" x="820" y="-1">software depends-on</text>
  </g>
  <g transform="translate(40, 714)">
    <text class="smallL" x="0" y="0">SPI2 shared bus: TLE92466ED + MAX22200 (separate chip-selects). SPI3 dedicated bus: ADS7952 12-ch external ADC.</text>
    <text class="smallL" x="0" y="14">NTC and VBUS measured via internal ADC. WS2812 status LED driven by the RMT peripheral. CAN/TWAI for host communication.</text>
  </g>
</svg>
