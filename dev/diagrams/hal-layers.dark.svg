<title id="hal-layers-title">Flux V1 HAL, layer by layer</title>
<desc id="hal-layers-desc">Layer stack of the Flux V1 HAL: application, the Flux facade, 7 managers, 5 hf-core handlers, 6 chip drivers, and the interface wrap on ESP-IDF and the ESP32-S3.</desc>
