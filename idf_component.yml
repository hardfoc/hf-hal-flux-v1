###############################################################################
#  HardFOC HAL Flux V1 — ESP-IDF Component Manager Manifest
#
#  This manifest file describes the HardFOC HAL (Hardware Abstraction Layer)
#  component for the ESP-IDF Component Manager. The HAL provides a unified
#  interface for valve control, sensor management, and communication on the
#  HardFOC Flux V1 platform.
#
#  For more information about the ESP-IDF Component Manager manifest format,
#  see: https://docs.espressif.com/projects/idf-component-manager/en/latest/reference/manifest_file.html
###############################################################################

# ─── Component Metadata ───────────────────────────────────────────────────────
name: hf-hal-flux-v1
version: "1.1.0"
description: |
  HardFOC Hardware Abstraction Layer for Flux V1 platform - comprehensive
  valve control, sensor management, and communication interface. Provides
  unified APIs for MAX22200 solenoid drivers, TLE92466ED proportional valve
  drivers, ADS7952 ADC, NTC thermistor monitoring, WS2812 LED control, and
  full ESP32-C6 integration with RTOS support.

# ─── External Links ───────────────────────────────────────────────────────────
url: "https://github.com/hardfoc/hf-hal-flux-v1"
repository: "https://github.com/hardfoc/hf-all-hals.git"
documentation: "https://github.com/hardfoc/hf-all-hals/blob/main/hf-hal-flux-v1/README.md"
issues: "https://github.com/hardfoc/hf-all-hals/issues"

# ─── Licensing and Maintenance ───────────────────────────────────────────────
license: "GPL-3.0-or-later"
maintainers:
  - "Nebiyu Tadesse <nebysma@gmail.com>"

# ─── Component Classification ────────────────────────────────────────────────
tags:
  - "hardfoc"           # HardFOC ecosystem
  - "valve-control"     # Valve control functionality
  - "hal"               # Hardware abstraction layer
  - "driver"            # Device drivers
  - "esp-idf"           # ESP-IDF framework
  - "max22200"          # MAX22200 solenoid driver
  - "tle92466ed"        # TLE92466ED proportional valve driver
  - "ads7952"           # ADS7952 12-bit SAR ADC
  - "solenoid"          # Solenoid valve control
  - "proportional"      # Proportional valve control
  - "sensor"            # Sensor management
  - "gpio"              # GPIO control
  - "spi"               # SPI communication
  - "i2c"               # I2C communication
  - "can"               # CAN communication
  - "adc"               # ADC functionality
  - "rtos"              # RTOS integration
  - "flux-v1"           # Flux V1 platform
  - "esp32c6"           # ESP32-C6 target
  - "embedded"          # Embedded systems

# ─── Supported Targets ───────────────────────────────────────────────────────
targets:
  - esp32c6             # Primary target - HardFOC Flux V1 platform

# ─── Dependencies ────────────────────────────────────────────────────────────
dependencies:
  # ESP-IDF Framework (required minimum version)
  # Note: All ESP-IDF core components (freertos, driver, etc.) are built-in
  # and bundled with ESP-IDF, so we only declare the framework itself.
  idf: ">=5.0.0"

# ─── Packaging Configuration ─────────────────────────────────────────────────
files:
  # Include all source files and headers
  include:
    - "lib/api/**/*"
    - "lib/managers/**/*"
    - "lib/core/**/*"
    - "CMakeLists.txt"
    - "idf_component.yml"
    - "LICENSE"
    - "README.md"
    - "DOCUMENTATION_INDEX.md"

  # Exclude development and documentation files to minimize package size
  exclude:
    # Documentation and examples
    - "**/docs/**"
    - "**/datasheet/**"
    - "**/examples/**"
    - "**/tests/**"

    # Development and CI files
    - "**/.github/**"
    - "**/.gitlab-ci.yml"
    - "**/.git/**"
    - "**/.svn/**"

    # IDE and editor files
    - "**/.idea/**"
    - "**/.vscode/**"
    - "**/.settings/**"
    - "**/.DS_Store"
    - "**/Thumbs.db"

    # Build artifacts
    - "**/build/**"
    - "**/dist/**"
    - "**/managed_components/**"
    - "**/dependencies.lock"
    - "**/sdkconfig"
    - "**/sdkconfig.old"
    - "**/.component_hash"

    # Python and cache files
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/*.pyd"
    - "**/*.pyo"
    - "**/*.py"

###############################################################################
#  Component Architecture Overview
#
#  The HardFOC Flux HAL consists of several layers:
#
#  1. API Layer (lib/api/)
#     - Flux API singleton providing unified access to all components
#     - System diagnostics and health monitoring
#     - Initialization order management
#
#  2. Managers (lib/managers/)
#     - CommChannelsManager: SPI, I2C, CAN interfaces
#     - GpioManager: ESP32-C6 GPIO management
#     - ValveManager: MAX22200 solenoid + TLE92466ED proportional control
#     - AdcManager: ESP32 internal + ADS7952 external ADC
#     - LedManager: WS2812 LED control
#     - TemperatureManager: ESP32 internal + NTC thermistor monitoring
#
#  3. Handlers (lib/core/handlers/)
#     - HAL-specific driver+util glue for each device type
#     - Unified interfaces for device communication
#     - Error handling and diagnostics
#
#  4. Core Drivers (lib/core/hf-core-drivers/)
#     - Interface wrappers for ESP32 peripherals
#     - Platform mapping and pin configuration
#
#  5. Core Utils (lib/core/hf-core-utils/)
#     - RTOS wrappers and utilities
#     - General-purpose utilities
#     - CAN communication utilities
#
#  Usage Example:
#  ```cpp
#  #include "api/Flux.h"
#
#  auto& flux = Flux::GetInstance();
#  if (flux.EnsureInitialized()) {
#      flux.valves.EnableChannel(ValveChannel::SOL_CH0);
#      float ntc_temp;
#      flux.temp.ReadNtcTemperature(ntc_temp);
#      flux.leds.SetStatus(LedAnimation::STATUS_OK);
#  }
#  ```
###############################################################################
