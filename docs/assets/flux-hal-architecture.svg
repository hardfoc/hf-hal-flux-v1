<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="t-flux d-flux">
  <title id="t-flux">HardFOC Flux V1 - HAL architecture and board topology</title>
  <desc id="d-flux">HardFOC Flux V1 is an ESP32 valve-control board. The HAL stacks application code on top of board-specific managers (ValveManager, etc.) which orchestrate per-chip handlers (TLE92466ED, MAX22200, WS2812, NTC) backed by the shared hf-core platform. Bottom: the physical chip layout on the board with bus interconnects.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .panel    { fill: #ffffff; }
      .app      { fill: #f0fff4; stroke: #276749; stroke-width: 2; }
      .api      { fill: #fef5e7; stroke: #c05621; stroke-width: 2; }
      .mgr      { fill: #ebf4ff; stroke: #2c5282; stroke-width: 2; }
      .mgr-cell { fill: #ffffff; stroke: #4299e1; stroke-width: 1.5; }
      .core     { fill: #fff5f5; stroke: #c53030; stroke-width: 2; }
      .core-cell{ fill: #ffffff; stroke: #e53e3e; stroke-width: 1.5; }
      .board    { fill: #f4f6f8; stroke: #1a365d; stroke-width: 2; }
      .mcu      { fill: #fef5e7; stroke: #c05621; stroke-width: 2; }
      .chip     { fill: #ebf4ff; stroke: #2c5282; stroke-width: 1.6; }
      .sense    { fill: #f0fff4; stroke: #276749; stroke-width: 1.6; }
      .led      { fill: #faf5ff; stroke: #6b46c1; stroke-width: 1.6; }
      .wire-pwr { stroke: #c53030; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-spi { stroke: #2b6cb0; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-i2c { stroke: #38a169; stroke-width: 2; fill: none; stroke-linecap: round; }
      .wire-can { stroke: #d69e2e; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-rmt { stroke: #6b46c1; stroke-width: 2; fill: none; stroke-linecap: round; }
      .wire-adc { stroke: #4a5568; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 3 2; }
      .arrow-dn { stroke: #2c5282; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .head     { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .layer-title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; text-anchor: start; }
      .title    { font-family: system-ui, sans-serif; font-size: 12.5px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .titleL   { font-family: system-ui, sans-serif; font-size: 12.5px; font-weight: 600; fill: #1a365d; text-anchor: start; }
      .small    { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: middle; }
      .smallL   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: start; }
      .smallR   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: end; }
      .pin      { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 11px; fill: #1a202c; text-anchor: middle; }
      .pinL     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 11px; fill: #1a202c; text-anchor: start; }
      .legend   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; }
      .badge    { font-family: system-ui, sans-serif; font-size: 10.5px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    ]]></style>
    <marker id="ar-d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2c5282"/>
    </marker>
  </defs>
  <rect class="panel" width="960" height="700"/>

  <text class="head" x="480" y="26">HardFOC Flux V1 - HAL architecture and board topology</text>
  <text class="small" x="480" y="44">ESP32-based valve-control board. Drives 8 solenoid valves (MAX22200) and 6 proportional valves (TLE92466ED) under a unified manager facade.</text>

  <!-- =========== TOP HALF: software stack =========== -->

  <!-- Layer 1: Application -->
  <rect class="app" x="40" y="62" width="880" height="44" rx="6"/>
  <text class="titleL" x="56" y="80" fill="#276749">Application code  -  user firmware</text>
  <text class="smallL" x="56" y="96">#include "Flux.h"  -&gt;  Flux::GetInstance().valves().OpenAll();</text>

  <line class="arrow-dn" x1="200" y1="106" x2="200" y2="130" marker-end="url(#ar-d)"/>
  <line class="arrow-dn" x1="700" y1="106" x2="700" y2="130" marker-end="url(#ar-d)"/>

  <!-- Layer 2: Flux API -->
  <rect class="api" x="40" y="130" width="880" height="44" rx="6"/>
  <text class="titleL" x="56" y="148" fill="#c05621">Flux API  (lib/api)</text>
  <text class="smallL" x="56" y="164">Flux.h / Flux.cpp / FluxVersion.h - singleton facade exposing the board to user code.</text>

  <line class="arrow-dn" x1="200" y1="174" x2="200" y2="198" marker-end="url(#ar-d)"/>
  <line class="arrow-dn" x1="700" y1="174" x2="700" y2="198" marker-end="url(#ar-d)"/>

  <!-- Layer 3: Managers -->
  <rect class="mgr" x="40" y="198" width="880" height="74" rx="6"/>
  <text class="titleL" x="56" y="218" fill="#2c5282">Managers  (lib/managers)</text>
  <text class="smallL" x="56" y="234">Flux-specific orchestration. Each manager owns the handlers it needs.</text>

  <g>
    <rect class="mgr-cell" x="60"  y="240" width="120" height="26" rx="4"/><text class="title" x="120" y="258">CommChannels</text>
    <rect class="mgr-cell" x="186" y="240" width="120" height="26" rx="4"/><text class="title" x="246" y="258">GpioManager</text>
    <rect class="mgr-cell" x="312" y="240" width="120" height="26" rx="4"/><text class="title" x="372" y="258">AdcManager</text>
    <rect class="mgr-cell" x="438" y="240" width="120" height="26" rx="4"/><text class="title" x="498" y="258">TempManager</text>
    <rect class="mgr-cell" x="564" y="240" width="120" height="26" rx="4"/><text class="title" x="624" y="258">LedManager</text>
    <rect class="mgr-cell" x="690" y="240" width="220" height="26" rx="4"/><text class="title" x="800" y="258">ValveManager  (Flux-specific)</text>
  </g>

  <line class="arrow-dn" x1="200" y1="272" x2="200" y2="296" marker-end="url(#ar-d)"/>
  <line class="arrow-dn" x1="500" y1="272" x2="500" y2="296" marker-end="url(#ar-d)"/>
  <line class="arrow-dn" x1="800" y1="272" x2="800" y2="296" marker-end="url(#ar-d)"/>

  <!-- Layer 4: Handlers (hf-core) consumed -->
  <rect class="core" x="40" y="296" width="880" height="74" rx="6"/>
  <text class="titleL" x="56" y="316" fill="#c53030">Handlers consumed from hf-core  (lib/core/handlers)</text>
  <text class="smallL" x="56" y="332">Per-chip facade: lazy init, RtosMutex, error mapping. Same handler code runs on Vortex too.</text>

  <g>
    <rect class="core-cell" x="60"  y="338" width="160" height="26" rx="4"/><text class="title" x="140" y="356">Tle92466edHandler</text>
    <rect class="core-cell" x="226" y="338" width="160" height="26" rx="4"/><text class="title" x="306" y="356">Max22200Handler</text>
    <rect class="core-cell" x="392" y="338" width="160" height="26" rx="4"/><text class="title" x="472" y="356">Ws2812Handler</text>
    <rect class="core-cell" x="558" y="338" width="160" height="26" rx="4"/><text class="title" x="638" y="356">NtcHandler</text>
    <rect class="core-cell" x="724" y="338" width="190" height="26" rx="4"/><text class="title" x="819" y="356">+ Logger, Comm, Gpio adapters</text>
  </g>

  <!-- =========== BOTTOM HALF: physical board =========== -->

  <line class="arrow-dn" x1="480" y1="370" x2="480" y2="394" marker-end="url(#ar-d)"/>
  <text class="smallL" x="488" y="386">platform layer constructs Esp* peripherals + chip drivers</text>

  <!-- Board panel (light gray) -->
  <rect class="board" x="40" y="394" width="880" height="234" rx="6"/>
  <text class="layer-title" x="56" y="416" fill="#1a365d">Flux V1 board (physical hardware)</text>
  <text class="smallL" x="56" y="432">ESP32 MCU at the centre; SPI bus to the two valve drivers; RMT to the status LED; ADC for VBUS and NTC; CAN to host.</text>

  <!-- Power rail (top of board section) -->
  <line class="wire-pwr" x1="80" y1="450" x2="880" y2="450"/>
  <text class="pinL" x="60" y="454">+VBUS</text>

  <!-- MCU at the center -->
  <rect class="mcu" x="380" y="466" width="200" height="100" rx="6"/>
  <text class="title" x="480" y="488">ESP32  (HardFOC Flux MCU)</text>
  <text class="small" x="480" y="506">SPI2 host, I2C, ADC1_CH0, RMT0, TWAI</text>
  <text class="pin" x="480" y="528">SPI2  &#183;  CAN/TWAI</text>
  <text class="pin" x="480" y="546">RMT0  &#183;  ADC1  &#183;  GPIO</text>
  <text class="small" x="480" y="562">3.3 V LDO from +VBUS</text>

  <!-- TLE92466ED on the left -->
  <rect class="chip" x="60" y="486" width="170" height="80" rx="6"/>
  <text class="title" x="145" y="506">TLE92466ED</text>
  <text class="small" x="145" y="522">6-ch low-side</text>
  <text class="small" x="145" y="538">proportional valves</text>
  <text class="small" x="145" y="556">(0-2 A / 0-4 A pair)</text>

  <!-- MAX22200 on the right -->
  <rect class="chip" x="730" y="486" width="170" height="80" rx="6"/>
  <text class="title" x="815" y="506">MAX22200</text>
  <text class="small" x="815" y="522">8-ch half-bridge</text>
  <text class="small" x="815" y="538">on/off solenoid valves</text>
  <text class="small" x="815" y="556">(36 V, 1 A RMS)</text>

  <!-- WS2812 LED above MCU -->
  <rect class="led" x="430" y="450" width="100" height="14" rx="3"/>
  <text class="small" x="480" y="460">WS2812 status LED  (RMT0)</text>

  <!-- NTC temp sensor + ADC sense block (bottom) -->
  <rect class="sense" x="280" y="582" width="160" height="36" rx="4"/>
  <text class="title" x="360" y="600">NTC 10 k&#937; (B=3950)</text>
  <text class="small" x="360" y="614">+ ADC1_CH0 VBUS sense (11x divider)</text>

  <!-- CAN transceiver -->
  <rect class="chip" x="600" y="582" width="160" height="36" rx="4"/>
  <text class="title" x="680" y="600">CAN/TWAI transceiver</text>
  <text class="small" x="680" y="614">500 kbps to host</text>

  <!-- =========== Wires =========== -->
  <!-- VBUS to MCU and chips -->
  <line class="wire-pwr" x1="145" y1="450" x2="145" y2="486"/>
  <line class="wire-pwr" x1="480" y1="450" x2="480" y2="466"/>
  <line class="wire-pwr" x1="815" y1="450" x2="815" y2="486"/>

  <!-- SPI bus from MCU to TLE / MAX -->
  <line class="wire-spi" x1="380" y1="500" x2="230" y2="500"/>
  <text class="smallL" x="245" y="494" fill="#2b6cb0">SPI (CS=18 to MAX, CS=15 to TLE)</text>

  <line class="wire-spi" x1="580" y1="500" x2="730" y2="500"/>
  <text class="smallR" x="730" y="494" fill="#2b6cb0">SPI</text>

  <!-- WS2812 RMT (small connector) -->
  <line class="wire-rmt" x1="480" y1="466" x2="480" y2="466" stroke-width="0.001"/>

  <!-- ADC NTC -->
  <line class="wire-adc" x1="440" y1="600" x2="480" y2="566"/>
  <text class="smallR" x="472" y="586" fill="#4a5568">ADC1_CH0</text>

  <!-- CAN to MCU -->
  <line class="wire-can" x1="600" y1="600" x2="580" y2="566"/>
  <text class="smallR" x="600" y="582" fill="#d69e2e">CAN_TX/RX</text>

  <!-- =========== Bottom legend =========== -->
  <g transform="translate(40, 660)">
    <text class="layer-title" x="0" y="0" fill="#1a365d">Legend</text>
    <line class="wire-pwr" x1="80"  y1="-5" x2="104" y2="-5"/>
    <text class="legend" x="112" y="-1">+VBUS power rail</text>
    <line class="wire-spi" x1="220" y1="-5" x2="244" y2="-5"/>
    <text class="legend" x="252" y="-1">SPI2 (chip CS lines)</text>
    <line class="wire-can" x1="370" y1="-5" x2="394" y2="-5"/>
    <text class="legend" x="402" y="-1">CAN / TWAI</text>
    <line class="wire-rmt" x1="490" y1="-5" x2="514" y2="-5"/>
    <text class="legend" x="522" y="-1">RMT (LED)</text>
    <line class="wire-adc" x1="600" y1="-5" x2="624" y2="-5"/>
    <text class="legend" x="632" y="-1">ADC sense</text>
    <line class="arrow-dn" x1="730" y1="-5" x2="754" y2="-5" marker-end="url(#ar-d)"/>
    <text class="legend" x="762" y="-1">software depends-on</text>
  </g>
</svg>
