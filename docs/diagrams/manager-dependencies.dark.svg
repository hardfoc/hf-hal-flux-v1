<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="664" viewBox="0 0 1200 664" role="img" aria-labelledby="manager-dependencies-title manager-dependencies-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="manager-dependencies-title">Managers, handlers and drivers</title>
<desc id="manager-dependencies-desc">Graph from each manager to the hf-core handlers it uses and from each handler to the chip driver it wraps: ValveManager to the MAX22200 and TLE92466ED handlers, AdcManager to the ADS7952 handler, TemperatureManager to the NTC and MCP9700 handlers, and LedManager directly to the WS2812 driver.</desc>
