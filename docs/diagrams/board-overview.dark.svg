<text x="52" y="164.6" font-size="15" font-weight="700" fill="#C7CBFF">ESP32-S3</text>
<text x="52" y="189.4" font-size="13" fill="#D2DAE4">dual-core MCU</text>
<text x="52" y="208.2" font-size="13" fill="#D2DAE4">runs the HAL and your app</text>
<text x="52" y="227.1" font-size="13" fill="#D2DAE4">USB-JTAG on GPIO19/20</text>
<text x="662" y="164.6" font-size="15" font-weight="700" fill="#E8EDF3">MAX22200</text>
<text x="662" y="189.4" font-size="13" fill="#D2DAE4">8 solenoid channels (SOL_CH0-7)</text>
<text x="662" y="208.2" font-size="13" fill="#D2DAE4">hit / hold current or duty</text>
<text x="662" y="294.6" font-size="15" font-weight="700" fill="#E8EDF3">TLE92466ED</text>
<text x="662" y="319.4" font-size="13" fill="#D2DAE4">6 proportional channels (PROP_CH0-5)</text>
<text x="662" y="338.2" font-size="13" fill="#D2DAE4">current control, PWM, dither</text>
<text x="662" y="424.6" font-size="15" font-weight="700" fill="#E8EDF3">ADS7952</text>
<text x="662" y="449.4" font-size="13" fill="#D2DAE4">12-channel 12-bit external ADC</text>
<text x="662" y="468.3" font-size="13" fill="#D2DAE4">MCP9700 sensor on CH8</text>
<text x="662" y="540.5" font-size="15" font-weight="700" fill="#E8EDF3">NTC thermistor and VBUS divider</text>
<text x="662" y="565.4" font-size="13" fill="#D2DAE4">ESP32 ADC1 CH7 and CH8 (divider 11)</text>
<text x="662" y="646.5" font-size="15" font-weight="700" fill="#E8EDF3">CAN transceiver</text>
<text x="662" y="671.4" font-size="13" fill="#D2DAE4">external devices</text>
<text x="662" y="742.5" font-size="15" font-weight="700" fill="#E8EDF3">FDO2 oxygen probe</text>
<text x="662" y="767.4" font-size="13" fill="#D2DAE4">UART, acquired on demand</text>
<text x="662" y="838.5" font-size="15" font-weight="700" fill="#E8EDF3">WS2812</text>
<text x="662" y="863.4" font-size="13" fill="#D2DAE4">RGB status LED</text>
<text x="280" y="149.8" font-size="12" fill="#9AA6B5">Valve SPI: SCK GPIO36, MOSI GPIO37, MISO GPIO35</text>
<rect x="373.9" y="163.8" width="156.2" height="20" rx="10" fill="#0E131A"/>
<text x="452" y="178.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">SPI mode 0, CS GPIO38</text>
<rect x="322.9" y="207.8" width="258.2" height="20" rx="10" fill="#0E131A"/>
<text x="452" y="222.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">EN GPIO2, CMD GPIO39, FAULT GPIO42</text>
<rect x="379.2" y="293.8" width="145.6" height="20" rx="10" fill="#0E131A"/>
<text x="452" y="308.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">SPI mode 1, CS GPIO4</text>
<rect x="326.6" y="337.8" width="250.8" height="20" rx="10" fill="#0E131A"/>
<text x="452" y="352.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">EN GPIO5, RESN GPIO6, FAULT GPIO16</text>
<rect x="359.7" y="423.8" width="184.6" height="20" rx="10" fill="#0E131A"/>
<text x="452" y="438.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">ADC SPI mode 0, CS GPIO10</text>
<rect x="322.7" y="457.8" width="258.6" height="20" rx="10" fill="#0E131A"/>
<text x="452" y="472.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">SCK GPIO12, MOSI GPIO11, MISO GPIO13</text>
<rect x="405.1" y="546.8" width="93.8" height="20" rx="10" fill="#0E131A"/>
<text x="452" y="561.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">analog inputs</text>
<rect x="357.4" y="647.8" width="189.2" height="20" rx="10" fill="#0E131A"/>
<text x="452" y="662.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">TWAI TX GPIO17 / RX GPIO18</text>
<rect x="353.6" y="743.8" width="196.7" height="20" rx="10" fill="#0E131A"/>
<text x="452" y="758.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">UART TX GPIO47 / RX GPIO48</text>
<rect x="395.8" y="839.8" width="112.4" height="20" rx="10" fill="#0E131A"/>
<text x="452" y="854.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">RMT data GPIO3</text>
<text x="46" y="964.5" font-size="15" font-weight="700" fill="#E2E8F0">Also on the pin map</text>
<text x="46" y="982.3" font-size="13" fill="#E2E8F0">MAX22200 trigger inputs: TRIGA GPIO40, TRIGB GPIO41. TLE92466ED direct drive inputs: DRV0 GPIO7, DRV1 GPIO15. The pin map calls the valve bus SPI2 and the ADC</text>
<text x="46" y="1001.2" font-size="13" fill="#E2E8F0">bus SPI3; in ESP-IDF terms the valve bus runs on SPI3_HOST and the ADC bus on SPI2_HOST (see CommChannelsManager.cpp).</text>
