<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">Flux V1: buses and chips</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Every GPIO, ADC channel and SPI mode below is read from the pin map and the comms manager.</text>
